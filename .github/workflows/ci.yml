name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            api/package-lock.json

      - name: Backend install and syntax
        working-directory: api
        run: |
          npm ci --ignore-scripts
          node --check server.js
          node --check lib/execution.js
          node --check lib/evidence.js
          node --check lib/evidenceStore.js
          node --check lib/evidenceAnalyze.js

      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
