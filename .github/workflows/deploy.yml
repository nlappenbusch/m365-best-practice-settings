name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-m365-security
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Deploy M365 Security Tool
        env:
          # Repo-Secret (Settings -> Secrets and variables -> Actions).
          # Wird ueber deploy.sh an docker compose durchgereicht — nie im Repo-Code.
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash /opt/m365-security/deploy.sh
