server {
    listen 80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    
    # Agent-Downloads (Bitdefender/N-sight): reine Datei-Streams, teils mehrere
    # hundert MB und der N-sight-Build dauert. Ohne Buffering direkt durchreichen,
    # sonst haelt nginx den ganzen Installer erst im Speicher/auf Platte fest.
    # Muss VOR "location /api/" stehen (laengeres Praefix gewinnt zwar, aber
    # explizit ist hier besser lesbar).
    location /api/downloads/ {
        resolver 127.0.0.11 valid=30s;
        set $dl_upstream http://api:3000;
        proxy_pass $dl_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Live-Deploy-Backend (EXO-Deploys koennen mehrere Minuten dauern).
    # Variable + Docker-DNS-Resolver: nginx startet auch, wenn der api-Container fehlt.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://api:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Main location
    location / {
        try_files $uri $uri/ /index.html;
    }
    
    # JS/CSS: revalidieren statt lange cachen — die Asset-URLs tragen zwar einen
    # Versions-Stempel pro Build, aber no-cache schuetzt auch Clients, die noch
    # alte ungestempelte URLs kennen (ETag/304 macht das praktisch kostenlos).
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Bilder/Fonts duerfen lange gecached werden
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
    
    # Disable access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
