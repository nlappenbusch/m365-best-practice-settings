stages: [build, deploy-prod]
default: { tags: [igeeks-docker] }

variables:
  IMAGE: $CI_REGISTRY_IMAGE
  TAG: $CI_COMMIT_SHORT_SHA

.kaniko:
  stage: build
  image: { name: gcr.io/kaniko-project/executor:v1.23.2-debug, entrypoint: [""] }
  before_script:
    - mkdir -p /kaniko/.docker
    - 'echo "{\"auths\":{\"$CI_REGISTRY\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > /kaniko/.docker/config.json'
  rules: [ { if: '$CI_COMMIT_BRANCH == "main"' } ]

# Frontend-SPA + nginx (Dockerfile im Repo-Root)
build-website:
  extends: .kaniko
  script:
    - '/kaniko/executor
        --context "$CI_PROJECT_DIR"
        --dockerfile "$CI_PROJECT_DIR/Dockerfile"
        --destination "$IMAGE/website:$TAG"
        --destination "$IMAGE/website:latest"
        --skip-tls-verify-registry=registry.igeeks.ch'

# Live-Deploy-API (Node + pwsh + ExchangeOnlineManagement; Build dauert einige Minuten)
build-api:
  extends: .kaniko
  script:
    - '/kaniko/executor
        --context "$CI_PROJECT_DIR/api"
        --dockerfile "$CI_PROJECT_DIR/api/Dockerfile"
        --destination "$IMAGE/api:$TAG"
        --destination "$IMAGE/api:latest"
        --skip-tls-verify-registry=registry.igeeks.ch'

deploy-prod:
  stage: deploy-prod
  # Image mit vorinstalliertem git statt alpine + "apk add git": der Runner
  # erreicht dl-cdn.alpinelinux.org nicht (zweimal reproduziert am 25.08.2026,
  # "temporary error"), waehrend Images aus der Registry problemlos laden.
  # Ohne Paketinstallation ist der Job davon unabhaengig.
  # entrypoint leeren: das Image startet sonst direkt "git", und der Runner
  # haengt sein "sh -c ..." als Argument an -> "'sh' is not a git command".
  image: { name: alpine/git:2.45.2, entrypoint: [""] }
  variables: { OVERLAY: igeeks-prod }
  before_script: [ "git --version" ]
  script:
    - 'git config user.email "ci@igeeks.ch" && git config user.name "m365-configurator-ci"'
    - 'git config http.sslVerify false'
    - 'git remote set-url origin "https://oauth2:${GITOPS_PUSH_TOKEN}@gitlab.igeeks.ch/igeeks/igeeks-apps/m365-configurator.git"'
    - 'git fetch origin main && git checkout main && git pull --rebase origin main'
    - 'sed -i "s|^\([[:space:]]*imageTag:\).*|\1 ${TAG}|" deploy/chart/values-${OVERLAY}.yaml'
    - 'git add deploy/chart/values-${OVERLAY}.yaml'
    - 'git commit -m "deploy ${OVERLAY} m365-configurator ${TAG} [skip ci]" || echo "kein Diff"'
    - 'git push origin main'
  rules: [ { if: '$CI_COMMIT_BRANCH == "main"' } ]
