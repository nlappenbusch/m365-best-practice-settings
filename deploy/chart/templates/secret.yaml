apiVersion: v1
kind: Secret
metadata:
  name: m365-configurator-secret
type: Opaque
stringData:
  # Alle Keys müssen im Vault existieren — leerer String ist ok (Bereich bleibt inaktiv)
  ADMIN_PASSWORD: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#ADMIN_PASSWORD>"
  BD_API_KEY: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#BD_API_KEY>"
  RMM_API_KEY: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#RMM_API_KEY>"
  SDP_API_KEY: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#SDP_API_KEY>"
  ANTHROPIC_API_KEY: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#ANTHROPIC_API_KEY>"
  # SDP-CRM-Matcher (/plan/-Dashboard, api/lib/zoho.js) — Zoho-Self-Client, nur lesend
  ZOHO_CLIENT_ID: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#ZOHO_CLIENT_ID>"
  ZOHO_CLIENT_SECRET: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#ZOHO_CLIENT_SECRET>"
  ZOHO_REFRESH_TOKEN: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#ZOHO_REFRESH_TOKEN>"
---
apiVersion: v1
kind: Secret
metadata:
  name: m365-configurator-registry
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: "<path:kv-v2/data/{{ .Values.vaultCluster }}/m365-configurator#dockerconfigjson>"
