# NICHT mit echten Werten committen. username = gitlab+deploy-token-<id>, insecure=true.
apiVersion: v1
kind: Secret
metadata:
  name: repo-m365-configurator
  namespace: argocd
  labels: { argocd.argoproj.io/secret-type: repository }
type: Opaque
stringData:
  type: git
  url: https://gitlab.igeeks.ch/igeeks/igeeks-apps/m365-configurator.git
  username: "gitlab+deploy-token-<ID>"
  password: "<DEPLOY_TOKEN>"
  insecure: "true"
